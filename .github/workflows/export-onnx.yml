name: export-onnx
on:
  workflow_dispatch:
  push:
    paths:
      - export_onnx.py
      - push_hf.py
      - requirements-export.txt
      - scripts/build_web_dicts.py
      - normalize.js
      - tests/fixtures.json
      - tests/test_normalize.mjs
      - .github/workflows/export-onnx.yml
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-export.txt
      - name: Install deps (CPU torch)
        run: pip install -r requirements-export.txt
      - name: Export ONNX
        run: python export_onnx.py --check
      - name: Validate
        run: |
          ls -lh models vocab.json
          python -c "import onnx, json; [onnx.load(f'models/{n}.onnx') for n in ('text_stage','sound_stage','decoder')]; d = json.load(open('models/foreign_dict.json')); print('onnx & dict ok, entries:', len(d))"
          python scripts/build_web_dicts.py --check
          node --test tests/test_normalize.mjs tests/test_audio.mjs
      - name: Push models to HuggingFace
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: fr0stb1rd/antalia-mini-web-onnx
        run: python push_hf.py
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vocab.json config.json || true
          git diff --cached --quiet || git commit -m "vocab & config (actions)"
          git push
